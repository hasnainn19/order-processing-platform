name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  order-api:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit and integration tests
        working-directory: order-api
        run: mvn verify

      - name: Build Docker image
        run: docker build -t order-api:ci ./order-api

  payment-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit and integration tests
        working-directory: payment-worker
        run: mvn verify

      - name: Build Docker image
        run: docker build -t payment-worker:ci ./payment-worker
