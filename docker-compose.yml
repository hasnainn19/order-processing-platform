services:
  postgres:
    image: postgres:16
    container_name: order-platform-postgres
    environment:
      POSTGRES_DB: orderplatform
      POSTGRES_USER: orderapp
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: order-platform-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: